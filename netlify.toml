[build]
  publish = "."

# RuralEOC moved to its own domain (see jfluhmann/ruraleoc-landing).
# Direct 301s, path-preserving, no chains. Deploy only after ruraleoc.com is live.
[[redirects]]
  from = "/rural-eoc"
  to = "https://ruraleoc.com/"
  status = 301
  force = true

[[redirects]]
  from = "/rural-eoc/*"
  to = "https://ruraleoc.com/:splat"
  status = 301
  force = true

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; script-src 'self' 'unsafe-inline'"

# Cache static assets aggressively
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Netlify automatically detects forms with data-netlify="true"
# No additional configuration needed for form handling
